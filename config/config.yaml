# MarketMind AI Configuration

# Agent Settings
agents:
  market_data_agent:
    enabled: true
    fetch_interval: 300       # seconds (5 minutes)
    stocks:
      - "TCS"
      - "WIPRO"
      - "DMART"
      - "RELIANCE"
      - "INFY"
    data_sources:
      - "NSE"

  news_agent:
    enabled: true
    fetch_interval: 600       # 10 minutes
    max_articles_per_stock: 5
    lookback_hours: 24

  ai_analysis_agent:
    enabled: true
    provider: "gemini"        # "gemini" or "openai"
    model: "gemini-2.5-flash" # For Gemini: gemini-1.5-flash, gemini-1.5-pro
                              # For OpenAI: gpt-4o-mini, gpt-4, etc.
    # API keys must be set as environment variables: GEMINI_API_KEY or OPENAI_API_KEY

  signal_generator_agent:
    enabled: true
    risk_tolerance: "medium"  # low / medium / high

  report_generator_agent:
    enabled: true

  email_alert_agent:
    enabled: true
    smtp:
      host: "smtp.gmail.com"
      port: 587
      use_tls: true
      use_ssl: false
      sender: "marketmindtw@gmail.com"
      recipients:
        - "marketmindtw@gmail.com"

# Data Sources
data_sources:
  nse:
    base_url: "https://www.nseindia.com"
    timeout: 30
  bse:
    base_url: "https://www.bseindia.com"
    timeout: 30

# Database (SQLite – production can use PostgreSQL via SQLAlchemy URL)
database:
  type: "sqlite"
  path: "data/marketmind.db"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/marketmind.log"

# Scheduler (for continuous mode)
scheduler:
  run_interval_minutes: 30   # Full pipeline run every 30 minutes

